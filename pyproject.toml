[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sendflit"
version = "1.1.0"
description = "The official SendFlit SDK for Python — transactional email API for applications and AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SendFlit" }]
keywords = ["sendflit", "email", "transactional", "api", "ai agents", "mcp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
]

[project.urls]
Homepage = "https://sendflit.com"
Repository = "https://github.com/Sendflit/sendflit-python"

[tool.setuptools.packages.find]
include = ["sendflit*"]
